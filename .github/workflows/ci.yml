name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: docker compose up -d --wait mongo
      - run: npm run db:init
      - run: docker compose exec mongo mongosh --quiet --host localhost:27017 --eval 'for (let i = 0; i < 60; i++) { try { if (rs.status().myState === 1) quit(0); } catch (_) {} sleep(1000); } quit(1);'
      - run: npm run test:integration
      - run: npm run build
      - if: always()
        run: docker compose down -v
