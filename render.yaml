services:
  - type: web
    name: washday-demo
    runtime: docker
    plan: free
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEPLOYMENT_MODE
        value: demo
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: UPLOAD_DIR
        value: /tmp/washday-uploads
      - key: PUBLIC_APP_URL
        value: https://washday-demo.onrender.com
